# Server Port (Render dynamic port binding; defaults to 8080 locally)
server.port=${PORT:8080}

# Application Metadata
spring.application.name=NetworkManagementApplication

# PostgreSQL Database Configuration
# Supports Neon / hosted direct URL (SPRING_DATASOURCE_URL or DB_URL) with fallback to local components
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:network_management}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# CORS Configuration (supports comma-separated origins or FRONTEND_URL)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:}}
